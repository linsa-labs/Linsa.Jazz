[package]
name = "jazz-rn"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
uniffi = "0.30.0"
thiserror = "1.0.64"
jazz_tools = { package = "jazz-tools", path = "../../jazz-tools", version = "2.0.0-alpha.0", features = [
  "sqlite",
  "transport-websocket",
] }
tokio = { version = "1", features = ["rt"] }
futures = "0.3"
uuid = { version = "1", features = ["v7"] }
blake3 = "1.8.2"
base64 = "0.22.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indexmap = { version = "2.0", features = ["serde"] }
hex = "0.4"
tracing = "0.1"
# Only the pieces the engine-log subscriber needs: no `fmt`, no ansi colouring.
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "std",
  "registry",
  "env-filter",
] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
uniffi = { version = "0.30.0", features = ["build"] }
# Compiles the Apple unified-logging shim (src/os_log_shim.c); skipped on
# non-Apple targets by build.rs.
cc = "1"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]
